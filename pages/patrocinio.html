<head>
    <meta charset="UTF-8">

    <title>Formulário de Patrocínio</title>
    <link rel="stylesheet" href="../css/patrocinio.css">
</head>

<body>
    <header>

        <div class="menu">

            <div class="logo">
                Bengala Supersônica
            </div>

            <nav>
                <a href="../pages/index.html#sobre">Sobre</a>
                <a href="../pages/index.html#vantagens">Vantagens</a>
                <a href="../pages/index.html#galeria">Galeria</a>
                <a href="../pages/index.html#patrocinio">Patrocínio</a>
                <a href="../pages/index.html">Voltar ao site</a>
            </nav>

        </div>
    </header>

    <div class="container">
        <h1>Formulário de Patrocínio</h1>
        <p>Preencha os dados abaixo para enviar sua proposta de patrocínio.</p>
        <form action="#" method="post">
            <div class="field-group">
                <label for="nome">Nome do patrocinador</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome ou empresa" required>
            </div>
            <div class="field-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>
            <div class="field-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
            </div>
            <div class="field-group">
                <label for="tipo">Tipo de patrocínio</label>
                <select id="tipo" name="tipo" required>
                    <option value="">Selecione uma opção</option>
                    <option value="financeiro">Financeiro</option>
                    <option value="produtos">Produtos</option>
                    <option value="servicos">Serviços</option>
                    <option value="midia">Mídia/Divulgação</option>
                </select>
            </div>
            
            <div class="field-group valor-group">
             <label for="valor">Valor estimado ou contribuição (mínimo R$ 100,00)</label>
              <input type="text" id="valor" name="valor" placeholder="R$ 100,00">
              <small id="erro-valor" class="erro-mensagem">O valor mínimo é R$ 100,00</small>
            </div>

            <div class="field-group">
                <label for="mensagem">Mensagem ou proposta</label>
                <textarea id="mensagem" name="mensagem" placeholder="Descreva sua proposta de patrocínio"
                    required></textarea>
            </div>
            <div class="field-group">
                <label for="termos">
                    <input type="checkbox" id="termos" name="termos" required>
                    Li e concordo com os
                    <button type="button" id="btnTermos" class="link-termos">termos de patrocínio</button>.
                </label>
            </div>
            <div class="actions">
                <button type="submit" id="btnEnviar">Enviar proposta</button>
            </div>
        </form>
    </div>
